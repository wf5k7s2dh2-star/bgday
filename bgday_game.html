<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ном-Ном!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#111;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;touch-action:none;user-select:none;font-family:Arial,sans-serif;}
#wrap{position:relative;width:360px;height:640px;background:linear-gradient(180deg,#87CEEB 0%,#B0DDE0 60%,#90D080 100%);border-radius:24px;overflow:hidden;}
#ui{position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;pointer-events:none;z-index:10;}
.box{background:rgba(0,0,0,0.18);border-radius:12px;padding:6px 14px;text-align:center;}
.lbl{font-size:10px;color:rgba(0,0,0,0.45);text-transform:uppercase;letter-spacing:1px;}
.val{font-size:22px;font-weight:900;color:#111;}
.hearts{display:flex;gap:4px;padding-top:6px;justify-content:flex-end;}
.heart{font-size:20px;transition:all .3s;}
.heart.lost{filter:grayscale(1);opacity:.3;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);}
.screen h1{font-size:40px;font-weight:900;color:#fff;margin-bottom:8px;text-align:center;}
.screen p{font-size:14px;color:rgba(255,255,255,.55);margin-bottom:28px;text-align:center;line-height:1.6;}
.btn{background:#e8ff57;color:#0a0a0a;border:none;border-radius:16px;padding:15px 48px;font-size:17px;font-weight:900;cursor:pointer;}
.fscore{font-size:64px;font-weight:900;color:#e8ff57;line-height:1;margin-bottom:4px;}
.flbl{font-size:12px;color:rgba(255,255,255,.4);margin-bottom:28px;text-transform:uppercase;letter-spacing:2px;}
#bar{position:absolute;bottom:0;left:0;height:3px;background:#e8ff57;z-index:10;border-radius:0 2px 2px 0;transition:width .5s;}
#itemsLayer{position:absolute;inset:0;pointer-events:none;z-index:5;}
.itm{position:absolute;font-size:44px;line-height:1;transform:translate(-50%,-50%);}
#poopsLayer{position:absolute;inset:0;pointer-events:none;z-index:7;}
.poop{position:absolute;font-size:22px;line-height:1;transform:translate(-50%,-50%);}
/* Leaderboard */
#lbScr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;z-index:20;background:rgba(0,0,0,.88);backdrop-filter:blur(6px);padding:24px 16px;}
#lbScr h2{font-size:28px;font-weight:900;color:#e8ff57;margin-bottom:4px;}
#lbScr .sub{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:16px;}
#lbList{width:100%;flex:1;overflow-y:auto;}
.lb-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;margin-bottom:8px;background:rgba(255,255,255,.07);}
.lb-row.me{background:rgba(232,255,87,.12);border:1px solid rgba(232,255,87,.3);}
.lb-rank{font-size:18px;font-weight:900;color:#e8ff57;width:28px;text-align:center;}
.lb-name{flex:1;font-size:14px;font-weight:600;color:#fff;}
.lb-score{font-size:16px;font-weight:900;color:#e8ff57;}
.lb-medal{font-size:20px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="360" height="640"></canvas>
  <div id="ui">
    <div class="box"><div class="lbl">Счёт</div><div class="val" id="sc">0</div></div>
    <div>
      <div class="box" style="margin-bottom:5px;"><div class="lbl">Уровень</div><div class="val" id="lv">1</div></div>
      <div class="hearts" id="hp">
        <span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span>
      </div>
    </div>
  </div>
  <div id="bar"></div>
  <div id="itemsLayer"></div>
  <div id="poopsLayer"></div>

  <!-- Leaderboard -->
  <div id="lbScr">
    <h2>🏆 Лидеры</h2>
    <div class="sub">Топ игроков всех времён</div>
    <div id="lbList"></div>
    <button class="btn" style="margin-top:16px;" onclick="hideLb()">Играть снова!</button>
  </div>
  <div class="screen" id="startScr">
    <div style="font-size:64px;margin-bottom:12px;">😮</div>
    <h1>Ном-Ном!</h1>
    <p>Лови еду 🍣🍔🌯<br>Избегай какашки 💩<br>5 какашек — взрыв!</p>
    <button class="btn" onclick="startGame()">Играть!</button>
  </div>
  <div class="screen" id="overScr" style="display:none;">
    <div style="font-size:64px;margin-bottom:12px;">💥</div>
    <div class="fscore" id="fsc">0</div>
    <div class="flbl">очков</div>
    <h1>БАБАХ!</h1>
    <p>Ты съел слишком много какашек!</p>
    <button class="btn" onclick="startGame()">Ещё раз!</button>
  </div>
</div>

const faceImgs = {};
Object.keys(faceData).forEach(k => {
  const img = new Image();
  img.onload = () => {
    const oc = document.createElement('canvas');
    oc.width = img.width; oc.height = img.height;
    const c2 = oc.getContext('2d');
    c2.drawImage(img,0,0);
    const id = c2.getImageData(0,0,oc.width,oc.height);
    const d = id.data;
    for(let i=0;i<d.length;i+=4){
      const r=d[i],g=d[i+1],b=d[i+2];
      if(r>230&&g>230&&b>230){d[i+3]=0;}
      else if(r>190&&g>190&&b>190){d[i+3]=Math.round(((255-(r+g+b)/3)/65)*255);}
    }
    c2.putImageData(id,0,0);
    faceImgs[k]=oc;
  };
  img.src=faceData[k];
});

const FOODS=['🍣','🍔','🌯','🥟','🍦','🍰','🍩','🧁'];

// Audio
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null;
function getAC(){if(!ac)ac=new AC();return ac;}

function soundCrunch(){
  const a=getAC();
  // Реалистичное жевание — несколько хрустов подряд
  [0, 0.06, 0.13].forEach(delay => {
    const b=a.createBuffer(1,a.sampleRate*.08,a.sampleRate);
    const d=b.getChannelData(0);
    for(let i=0;i<d.length;i++){
      const t=i/a.sampleRate;
      d[i]=Math.exp(-t*40)*(Math.random()*2-1)*(.5+Math.random()*.5);
    }
    const s=a.createBufferSource(); s.buffer=b;
    const f=a.createBiquadFilter(); f.type='bandpass';
    f.frequency.value=1800+Math.random()*1200; f.Q.value=.5;
    const g=a.createGain(); g.gain.value=.7+Math.random()*.3;
    s.connect(f); f.connect(g); g.connect(a.destination);
    s.start(a.currentTime+delay);
  });
}

function soundSplat(){
  const a=getAC();
  // Удар — низкий "шмяк"
  const b1=a.createBuffer(1,a.sampleRate*.06,a.sampleRate);
  const d1=b1.getChannelData(0);
  for(let i=0;i<d1.length;i++){
    const t=i/a.sampleRate;
    d1[i]=Math.exp(-t*60)*Math.sin(2*Math.PI*90*t);
  }
  const s1=a.createBufferSource(); s1.buffer=b1;
  const g1=a.createGain(); g1.gain.value=2.5;
  s1.connect(g1); g1.connect(a.destination); s1.start();

  // Слизь — мокрый булькающий хвост
  const b2=a.createBuffer(1,a.sampleRate*.35,a.sampleRate);
  const d2=b2.getChannelData(0);
  for(let i=0;i<d2.length;i++){
    const t=i/a.sampleRate;
    const env=Math.exp(-t*12);
    d2[i]=env*(Math.random()*2-1)*.4*Math.sin(2*Math.PI*60*t+Math.random()*3);
  }
  const s2=a.createBufferSource(); s2.buffer=b2;
  const f2=a.createBiquadFilter(); f2.type='lowpass'; f2.frequency.value=280; f2.Q.value=6;
  const g2=a.createGain(); g2.gain.value=1.8;
  s2.connect(f2); f2.connect(g2); g2.connect(a.destination);
  s2.start(a.currentTime+0.04);
}

function soundBoom(){
  const a=getAC();
  const b=a.createBuffer(1,a.sampleRate*.8,a.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++){const t=i/a.sampleRate; d[i]=Math.exp(-t*5)*(Math.random()*2-1)*.8;}
  const s=a.createBufferSource(); s.buffer=b;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=180;
  s.connect(f); f.connect(a.destination); s.start();
}

// Telegram user
let tgUser = null;
if(window.Telegram?.WebApp?.initDataUnsafe?.user){
  tgUser = window.Telegram.WebApp.initDataUnsafe.user;
}
const myName = tgUser ? (tgUser.username ? '@'+tgUser.username : tgUser.first_name) : 'Игрок';

// Leaderboard via localStorage (shared key per game)
const LB_KEY = 'nomnom_lb_v1';

function getLeaders(){
  try{ return JSON.parse(localStorage.getItem(LB_KEY)||'[]'); }
  catch(e){ return []; }
}

function saveScore(name, score){
  let lb = getLeaders();
  const existing = lb.find(r=>r.name===name);
  if(existing){ if(score>existing.score) existing.score=score; }
  else lb.push({name, score});
  lb.sort((a,b)=>b.score-a.score);
  lb = lb.slice(0,20);
  localStorage.setItem(LB_KEY, JSON.stringify(lb));
  return lb;
}

function showLb(lb){
  const medals=['🥇','🥈','🥉'];
  document.getElementById('lbList').innerHTML = lb.map((r,i)=>`
    <div class="lb-row${r.name===myName?' me':''}">
      <div class="lb-medal">${medals[i]||''}</div>
      <div class="lb-rank">${i+1}</div>
      <div class="lb-name">${r.name}</div>
      <div class="lb-score">${r.score}</div>
    </div>
  `).join('');
  document.getElementById('lbScr').style.display='flex';
}

function hideLb(){
  document.getElementById('lbScr').style.display='none';
  startGame();
}


let score=0,bombs=0,items=[],head={x:180,y:570},running=false,animId=null;
let spawnTimer=0,spawnInterval=110,fallSpeed=2.4,level=1;
let parts=[],poops=[],shake=0;

function startGame(){
  document.getElementById('startScr').style.display='none';
  document.getElementById('overScr').style.display='none';
  score=0; bombs=0; level=1;
  items=[]; parts=[]; poops=[]; shake=0;
  document.getElementById('itemsLayer').innerHTML='';
  document.getElementById('poopsLayer').innerHTML='';
  fallSpeed=2.4; spawnInterval=110; spawnTimer=0;
  head={x:W/2, y:H-70};
  updateUI();
  running=true;
  if(animId)cancelAnimationFrame(animId);
  loop();
}

function loop(){if(!running)return; update(); draw(); animId=requestAnimationFrame(loop);}

function update(){
  spawnTimer++;
  if(spawnTimer>=spawnInterval){
    spawnTimer=0; spawn();
    if(level>=3&&Math.random()<.3)spawn();
  }
  const nl=1+Math.floor(score/500);
  if(nl>level){
    level=nl;
    fallSpeed=Math.min(2.4+(level-1)*.5,9);
    spawnInterval=Math.max(110-(level-1)*12,38);
    document.getElementById('lv').textContent=level;
    document.getElementById('bar').style.width=Math.min((level-1)*10,100)+'%';
  }
  head.mouthOpen=items.some(it=>{
    const dx=Math.abs(it.x-head.x), dy=(head.y-10)-it.y;
    return dx<60&&dy>0&&dy<130;
  });
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    it.y+=it.speed;
    if(Math.abs(it.x-head.x)<40&&Math.abs(it.y-head.y)<36){
      if(it.type==='food'){score+=it.pts; addParts(it.x,it.y,'#FFD700',8); soundCrunch();}
      else{
        bombs++; shake=20; soundSplat();
        poops.push({angle:Math.random()*Math.PI*2, dist:38+Math.random()*16, rot:(Math.random()-.5)*1.4});
        updateUI();
        if(bombs>=5){gameOver();return;}
      }
      items.splice(i,1);
      document.getElementById('sc').textContent=score;
      continue;
    }
    if(it.y>H+50)items.splice(i,1);
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=.2; p.life--;
    if(p.life<=0)parts.splice(i,1);
  }
  if(shake>0)shake--;
}

function spawn(){
  const bomb=Math.random()<.22;
  items.push({
    type:bomb?'bomb':'food',
    emoji:bomb?'💩':FOODS[Math.floor(Math.random()*FOODS.length)],
    pts:10+Math.floor(Math.random()*15),
    x:36+Math.random()*(W-72),
    y:-50,
    speed:fallSpeed+Math.random()*1.2
  });
}

function addParts(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=(Math.PI*2/n)*i+Math.random()*.5, sp=2+Math.random()*3;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,color,life:25+Math.random()*15,size:4+Math.random()*4});
  }
}

function draw(){
  // Reset everything at start of frame
  cx.setTransform(1,0,0,1,0,0);
  cx.globalAlpha=1;
  cx.globalCompositeOperation='source-over';
  cx.clearRect(0,0,W,H);

  if(shake>0)cx.setTransform(1,0,0,1,(Math.random()-.5)*10,(Math.random()-.5)*6);

  // === ITEMS via DOM — always 100% visible ===
  const layer = document.getElementById('itemsLayer');
  // Sync DOM nodes with items array
  while(layer.children.length > items.length) layer.removeChild(layer.lastChild);
  while(layer.children.length < items.length){
    const d = document.createElement('div');
    d.className = 'itm';
    layer.appendChild(d);
  }
  items.forEach((it,i)=>{
    const d = layer.children[i];
    d.style.left = it.x + 'px';
    d.style.top = it.y + 'px';
    d.textContent = it.emoji;
  });

  // === PARTICLES ===
  parts.forEach(p=>{
    cx.globalAlpha=p.life/40;
    cx.fillStyle=p.color;
    cx.beginPath();
    cx.arc(p.x,p.y,p.size,0,Math.PI*2);
    cx.fill();
  });

  // === HEAD ===
  cx.globalAlpha=1;
  const r=42;
  const {x,y}=head;

  // Shadow
  cx.beginPath();
  cx.ellipse(x,y+r+2,r*.8,8,0,0,Math.PI*2);
  cx.fillStyle='rgba(0,0,0,0.2)';
  cx.fill();

  // Face image
  const key=bombs>=2?'sad':'normal';
  const img=faceImgs[key];
  if(img){
    cx.save();
    cx.beginPath();
    cx.arc(x,y,r,0,Math.PI*2);
    cx.clip();
    cx.globalAlpha=1;
    cx.drawImage(img,x-r*1.1,y-r*1.1,r*2.2,r*2.2);
    cx.restore();
  } else {
    // Fallback circle
    cx.beginPath();
    cx.arc(x,y,r,0,Math.PI*2);
    cx.fillStyle='#FFDDB5';
    cx.fill();
  }

  // === STUCK POOPS via DOM ===
  const pl = document.getElementById('poopsLayer');
  while(pl.children.length > poops.length) pl.removeChild(pl.lastChild);
  while(pl.children.length < poops.length){
    const d=document.createElement('div'); d.className='poop'; pl.appendChild(d);
  }
  poops.forEach((p,i)=>{
    const el=pl.children[i];
    const px=head.x+Math.cos(p.angle)*p.dist;
    const py=head.y+Math.sin(p.angle)*p.dist*.75;
    el.style.left=px+'px'; el.style.top=py+'px';
    el.style.transform=`translate(-50%,-50%) rotate(${p.rot}rad)`;
    el.textContent='💩';
  });
}

function updateUI(){
  document.querySelectorAll('.heart').forEach((h,i)=>{h.classList.toggle('lost',i>=(5-bombs));});
}

function gameOver(){
  running=false; soundBoom();
  addParts(head.x,head.y,'#ff6600',30);
  addParts(head.x,head.y,'#ffcc00',20);
  document.getElementById('fsc').textContent=score;
  document.getElementById('overScr').style.display='flex';
  // Save to leaderboard after short delay
  setTimeout(()=>{
    const lb = saveScore(myName, score);
    document.getElementById('overScr').style.display='none';
    showLb(lb);
  }, 1800);
}

const wrap=document.getElementById('wrap');
wrap.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!running)return;
  const r=wrap.getBoundingClientRect();
  head.x=Math.max(44,Math.min(W-44,e.touches[0].clientX-r.left));
},{passive:false});
wrap.addEventListener('mousemove',e=>{
  if(!running)return;
  const r=wrap.getBoundingClientRect();
  head.x=Math.max(44,Math.min(W-44,e.clientX-r.left));
});
</script>
